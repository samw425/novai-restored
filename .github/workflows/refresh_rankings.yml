name: Daily Ranking Refresh

on:
  schedule:
    - cron: '0 0 * * *' # Every night at midnight
  workflow_dispatch: # Allow manual trigger

jobs:
  refresh-rankings:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Scraper Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Black Box Engine v3.2
        run: |
          cd stelar/data
          python3 generate_rankings.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "Stelar Automation"
          git config --global user.email "bot@stelar.ai"
          git add stelar/web/public/rankings.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: nightly ranking refresh [Stelar v3.2]" && git push)
